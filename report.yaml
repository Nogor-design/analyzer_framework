######### Trade Pattern Audit ###############################################
#
# Evaluates every trade in each backtest's _trades.csv against market
# patterns active at the time of entry.  Each trade receives a verdict:
#   CONFIRMED  – weighted pattern score >= verdict_threshold
#   PARTIAL    – some patterns fired but below threshold
#   REJECTED   – no patterns confirmed the entry direction
#
# The report section renders:
#   • Per-run summary cards (counts + avg P&L / win rate by verdict)
#   • Collapsible pattern correlation table (win rate fired vs not fired)
#   • Collapsible color-coded trade-by-trade table
