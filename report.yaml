#####Exec cards ####################################################
  - id: run_executive_profile_cards
    options:
      show_hint: true
      show_run_image: true
      background_style: image-dark-overlay   # options below
      card_width_px: 1180
      card_padding_px: 24
      image_width_px: 420
      wlr_days_back: 30
      wlr_gap_px: 2
      show_detail_charts: true
      detail_chart_layout: stack    # two-up | stack
      detail_chart_width_px: 1080  #540  | 1080
      timeline_render_bin_minutes: 15   # 60 is clean; try 30 if you want more detail
      timeline_cell_h_px: 10
      timeline_show_hours: true
      timeline_show_summary: true
