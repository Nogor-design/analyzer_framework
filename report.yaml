report:
  title: "Strategy Comparison Report"
  output_filename: "comparison_report.html"
  embedded_images: true   # enforced by builder; kept for clarity
  timezone: "America/Denver"

sections:
  - id: comparison_overview
    title: "Comparison Overview"

  - id: equity_curve_comparison
    title: "Equity Curve Comparison"

  - id: run_kpi_cards
    title: "Run KPI Cards"

  - id: run_snapshot_clipboard
    title: "Run Snapshot (Copy/Paste)"
    options:
      compact: false
      show_hint: true


