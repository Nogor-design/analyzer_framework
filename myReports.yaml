  - report:
      title: "Daily Scoreboard"
      output_filename: "Daily_Scoreboard2_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:
      - id: daily_scoreboard
        title: "Daily Scoreboard + Best Non-Co-Losing Combos"
        options:
          show_individual_equity: true
          include_summary_table: true

          include_top_combos: true
          top_combo_n: 5
          beam_width: 250   # bump if you have many bots
          include_k2: true
          include_k3: true
          include_k4: true

  - report:
      title: "Daily run_card_catalog"
      output_filename: "run_card_catalog_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:
      - id: run_card_catalog
        title: "Cards by Session → Market"
        options:
          metric: profit_factor
          sort_desc: true
          max_per_group: 200
          hide_missing_cards: true
          fallback_session_label: "Unclassified"
          fallback_market_label: "Unknown"
          session_windows:
            - { label: "London",        start: "00:00", end: "04:00" }
            - { label: "NY Pre→Early",  start: "04:00", end: "10:30" }
            - { label: "NY Late",       start: "10:30", end: "16:00" }
            - { label: "Asia",          start: "16:00", end: "23:59" }
#          overrides:
#              "BrassAtlasFire":
#                session: "NY Pre→Early"
#                market: "NQ"
#              "SomeOtherRun":
#                session: "NY Pre→Early"


