reports:

  - report:
      title: "Comparison Report"
      output_filename: "Comparison_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:

      #Shows all bots ranked from net profit. Shows Net Profit,Profit Factor,Max Drawdown,Trades,Win Rate
      - id: comparison_overview
        title: "Comparison Overview"

      #Shows a chart with all bots on an equity curve
      - id: equity_curve_comparison
        title: "Equity Curve Comparison"

      #Shows this in nice row card format
      #Net Profit,#$10,625.00,#Profit Factor,#2.21,#Max Drawdown,#$-1,875.00,#Win Rate,#81.58%,#Trades: 38
      - id: run_kpi_cards
        title: "Run KPI Cards"

  - report:
      title: "Comparison Overview"
      output_filename: "Comparison_overview_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:

      #Shows all bots ranked from net profit. Shows Net Profit,Profit Factor,Max Drawdown,Trades,Win Rate
      - id: comparison_overview
        title: "Comparison Overview"


  - report:
      title: "Daily Scoreboard"
      output_filename: "Daily_Scoreboard_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:
    - id: daily_scoreboard
      title: "Daily Scoreboard + Combo Selection"
      options:
        include_all_bot_charts: true
        show_individual_equity: true
        include_summary_table: true

        combo_sets:
          - name: "Top 5 Pairs (k=2)"
            mode: top
            k: 2
            top_n: 5
            max_render: 5

          - name: "Top 5 Triples (k=3)"
            mode: top
            k: 3
            top_n: 5
            beam_width: 250
            max_render: 5

          - name: "Top 5 Quads (k=4)"
            mode: top
            k: 4
            top_n: 5
            beam_width: 300
            max_render: 5

          - name: "My Explicit Combos (always render)"
            mode: explicit
            combos:
              - bot_numbers: [ 1, 3 ]
              - bot_numbers: [ 1, 3, 4, 8 ]

  - report:
      title: "Overview Scoreboard"
      output_filename: "Overview_1_3.html"
      embedded_images: true   # enforced by builder; kept for clarity
      timezone: "America/Denver"

    sections:
      - id: comparison_overview
        title: "Comparison Overview"

      - id: equity_curve_comparison
        title: "Equity Curve Comparison"

      - id: run_kpi_cards
        title: "Run KPI Cards"

      - id: run_snapshot_clipboard
        title: "Run Snapshot (Copy/Paste)"
        options:
          compact: false
          show_hint: true


