report:
  title: Strategy Comparison Report
  output_filename: comparison_report.html
  embedded_images: true
  timezone: America/Denver
pattern_engine:
  enabled: true
  scopes:
  - run_attached
  - market_discovery
  run_id: __market_discovery__::NQ::03-26::1m
  instrument: NQ
  contract: 03-26
  tick_size: 0.25
  timeframe: 1m
  horizons:
  - 10
  - 20
  - 40
  prop:
    tick_value_usd: 5.0
    trailing_drawdown_usd: 2500
    daily_loss_limit_usd: 1000
  monte_carlo:
    mc_horizon: 20
    eval_days: 20
    dd_mode: global_peak
    n_paths: 2000
    seed: 7
    start_balance_usd: 50000
    profit_target_usd: 3000
    trailing_lock_buffer_usd: 100.0
    daily_loss_mode: from_open
    intake:
      enabled: true
      max_trades_per_day: 6
      cooldown_minutes: 20
      selection: take_first
      random_k: 6
      cooldown_scope: global
      per_entity_cap: null
    stress:
      slippage_ticks:
      - 0
      - 1
      - 2
      - 4
      spread_widen_ticks:
      - 0
      - 1
      - 2
      fill_prob:
      - 1.0
      - 0.9
      - 0.8
  sweep:
    patterns:
    - family: ORB
      structure: orb_break_retest
      direction_mode: both
      params:
        orb_minutes:
        - 15
        retest_bars:
        - 3
        - 5
  market_discovery:
    instrument: NQ
    contract: 03-26
    timeframe: 1m
    bars_source: auto
    start: null
    end: null
    run_id: __market_discovery__::NQ::03-26::1m
    discovery:
      atr_period: 14
      n_regimes: 4
    cv:
      n_folds: 5
sections:
- id: pattern_engine_overview
  title: Pattern Engine Overview
  options:
    top_n_runs: 12
    top_n_patterns: 20
- id: pattern_engine_mc_regime
  title: "Pattern Engine \u2014 Regime-aware MC"
  options:
    top_n: 25
    show_surface: true
- id: pattern_engine_diagnostics
  title: "Pattern Engine \u2014 Diagnostics"
  options:
    top_n_runs: 50
    run_id: ''
    show_only_failures: false
    include_asset_key_list: true
    include_issue_list: true
