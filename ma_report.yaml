report:
  title: MA Anchor Report
  output_filename: ma_anchor_report.html
  embedded_images: true
  timezone: America/Denver

sections:

  - id: anchor_interaction_overview
    title: MA Anchor Overview
    options:
      anchor_interaction: &ma_anchor_config
        enabled: true
        mode: market_only
        instrument: NQ
        contract: "03-26"
        timeframe: "1m"
        anchors:
          - { family: SMA, length: 20, source: close }
          - { family: EMA, length: 21, source: close }
          - { family: SMA, length: 50, source: close }
          - { family: EMA, length: 100, source: close }
        cross_mode: close
        exit_mode: touch
        recross_policy: first_return
        return_band_atr: 0.0
        return_band_ticks: 0.0
        min_bars_after_entry: 1
        descriptive_sample_floor: 100
        regime_sample_floor: 75
        tp_sl:
          enabled: true
          unit: atr
          tp_grid: [0.8,1.0,1.3,1.6,2.0]
          sl_grid: [0.6,0.8,1.0,1.2]

      show_presence: true
      show_notes: true

  - id: anchor_interaction_anchor_matrix
    title: MA Anchor Matrix
    options:
      anchor_interaction: *ma_anchor_config
      show_entry_exit: true
      show_role: true

  - id: anchor_interaction_tp_sl_spec
    title: MA Anchor TP/SL Specification
    options:
      anchor_interaction: *ma_anchor_config

  - id: anchor_interaction_diagnostics
    title: MA Anchor Diagnostics