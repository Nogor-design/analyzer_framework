report:
  title: "NQ VWAP Continuation After Reclaim Probe"
  output_filename: "03_nq_vwap_continuation_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

# Hypothesis: after price reclaims VWAP, a continuation bar that closes
# further away in the reclaim direction marks a directional commitment that
# often runs. This is structurally orthogonal to `vwap_reclaim_reject`
# (which fires *on* the reclaim) and to the failure/reclaim ORB family.

level_discovery:
  enabled: true
  min_trades: 40
  atr_period: 14
  timeframes: [1, 5]
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}
    prior_session_reaction: {enabled: false}
    reference_sweep_reclaim: {enabled: false}
    failed_reference_breakout: {enabled: false}
    liquidity_sweep_failure: {enabled: false}
    large_candle_origin_retest: {enabled: false}

    vwap_continuation:
      enabled: true
      min_continuation_ticks: [3.0, 5.0, 8.0]
      max_age_bars: [4, 8, 12]
      min_hold_bars: [1, 2]
      min_dist_ticks: [1.0]
      max_dist_ticks: [16.0, 24.0]
      min_atr_ticks: [4.0]
      direction: [0]
      invert_direction: [false]

  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [16, 24, 40, 60]
      stop: [8, 12, 16, 20]
    max_bars_timeout: 30
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 700
    top_n: 10

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30

research_note:
  status: "broad_probe"
  thesis: "VWAP reclaim continuation: enter on the bar that confirms commitment after reclaim, not on the reclaim itself."
  caution: "Broad probe — expect many filter rows below PF 1.0. Mine entry_discovery.top_rules for tradable pockets before promoting."
