# ============================================================
# STAGE 4 — NY OPEN SCALP (Trimmed)
# ============================================================
# Focused version of ny_open_scalp.yaml that won't hang.
#
# The strategy thesis:
#   The last candle before the 07:30 Denver bell (NY open)
#   predicts the direction of the first NY move. Trade with it.
#
# KEY DESIGN DECISION — only one entry type per run:
#   Run this file once for each entry type you care about.
#   Change "enabled: true" below to switch.
#
# Runtime: ~3-5 minutes with --no-tick-data
# Combos:  ~280
#
# WHAT TO LOOK AT:
#   "Candle Discovery Ranking" → which pattern fires consistently
#   in the premarket hour AND wins on next_open entry?
#   The winning pattern + direction = your NY open rule.
#
# SESSION TIMING (America/Denver = Mountain Time)
#   Premarket: 06:00–07:29
#   NY bell:   07:30
#   NY open:   07:30–08:59
#   Note: in winter (MST) this shifts 1 hour earlier.
# ============================================================

report:
  title: "Stage 4 — NY Open Scalp Discovery"
  output_filename: "04_ny_open.html"
  timezone: "America/Denver"

candle_discovery:
  enabled: true
  # Pre-NY + open window: 06:00-09:59 Denver = 14k bars instead of 78k (5× faster)
  # This is exactly the window where the strategy fires:
  #   premarket signal: 06:00-07:29
  #   trade execution:  07:30-09:59
  session_filter:
    hour_from: 6
    minute_from: 0
    hour_to: 10
  timeframes: [1]     # 1m is the signal bar timeframe
  min_trades: 15

  candle_features:
    size_lookbacks: [10]
    atr_period: 14
    tick_size: 0.25
    min_body_ticks: 1

  patterns:
    # The five patterns most relevant to NY open scalping:

    # 1. Large directional momentum bar just before bell
    large_body:
      enabled: true
      body_multiplier: [1.5, 2.0]
      wick_to_body_max: [0.5]
      lookback: [10]
      min_size_ticks: 3

    # 2. Strong impulse bar (large range, body-dominant)
    clean_breakout_bar:
      enabled: true
      atr_mult: [1.5, 2.0]
      body_to_range_min: [0.65]

    # 3. Hammer / shooting star (exhaustion signal)
    pin_bar_bullish:
      enabled: true
      wick_to_body_min: [1.5]
      body_to_range_max: [0.35]

    pin_bar_bearish:
      enabled: true
      wick_to_body_min: [1.5]
      body_to_range_max: [0.35]

    # 4. Coil before the open (inside bar = compression → expansion)
    inside_bar:
      enabled: true

    # 5. Engulfing (momentum confirmation)
    engulfing_bullish:
      enabled: true
      engulf_ratio: [1.0]

    engulfing_bearish:
      enabled: true
      engulf_ratio: [1.0]

    # Disabled for this run — re-enable to test
    doji:       {enabled: false}
    outside_bar: {enabled: false}

  direction: both

  entry_timing:
    # PICK ONE — change enabled: true/false to switch between runs
    next_open:
      enabled: true         # Run A: enter at the bar after the signal

    break_extreme:
      enabled: false        # Run B: stop-limit 1 tick beyond signal bar extreme
      buffer_ticks: 1
      fill_timeout_bars: 3

    body_midpoint:
      enabled: false        # Run C: pullback to 50% of signal bar body

  outcome:
    atr:   {enabled: false}
    ticks:
      enabled: true
      take_profit: [10, 15, 20]   # Scalp targets: 2.5pt / 3.75pt / 5pt
      stop: [8, 12]               # Stops: 2pt / 3pt
    max_bars_timeout: 10    # 10-bar (10min) timeout — scalp, not swing
    timeout_result: loss

  slippage_ticks: 1
  filter_discovery: {enabled: true, top_n: 5}

# ============================================================
# ORB — Opening Range Breakout (complementary signal)
# How does ORB compare to the candle pattern approach?
# 3 windows × 2 entry × 3 TP × 2 SL = 36 combos
# ============================================================
orb_discovery:
  enabled: true
  session_filter:
    hour_from: 7
    minute_from: 0
    hour_to: 10
  min_trades: 15
  orb_windows_min: [5, 10, 15]
  session_open_hour: 7
  session_open_minute: 30
  tick_size: 0.25
  tick_value: 12.50

  entry_timing:
    next_open:     {enabled: true}
    break_extreme: {enabled: true, buffer_ticks: 1, fill_timeout_bars: 3}
    body_midpoint: {enabled: false}

  outcome:
    atr:   {enabled: false}
    ticks:
      enabled: true
      take_profit: [10, 15, 20]
      stop: [8, 12]
    max_bars_timeout: 10
    timeout_result: loss

  slippage_ticks: 1
  filter_discovery: {enabled: false}

sections:
  - id: candle_discovery_ranking
    options:
      top_n: 20
      # Look here first. Which pattern wins on next_open entry?

  - id: candle_discovery_overview

  - id: orb_discovery_overview

  - id: strategy_discovery_unified
    options:
      top_n: 20
