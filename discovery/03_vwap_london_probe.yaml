report:
  title: "VWAP London Conditional Probe"
  output: "03_vwap_london_probe.html"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

level_discovery:
  enabled: true
  min_trades: 20
  atr_period: 14
  timeframes: [1]
  session_filter:
    hour_from: 0
    minute_from: 0
    hour_to: 6
    minute_to: 0
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    prior_session_reaction: {enabled: false}
    liquidity_sweep_failure: {enabled: false}
    vwap_reclaim_reject:
      enabled: true
      min_dist_ticks: [6, 8, 10]
      max_dist_ticks: [20, 24, 32]
      min_pierce_ticks: [1, 2]
      invert_direction: [true]
      direction: [0]
  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}
  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [16, 20, 24]
      stop: [10, 12, 16]
    max_bars_timeout: 15
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1
  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 20
    max_candidates: 600
    top_n: 10
  hardening: {enabled: false}

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30
