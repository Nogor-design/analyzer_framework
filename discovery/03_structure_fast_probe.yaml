report:
  title: "Structure Fast Probe"
  output_filename: "03_structure_fast_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

level_discovery:
  enabled: true
  min_trades: 20
  atr_period: 14
  timeframes: [1]

  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}

    vwap_reclaim_reject:
      enabled: true
      max_dist_ticks: [12.0, 24.0]
      min_pierce_ticks: [1.0]
      invert_direction: [false, true]
      direction: [0]

    prior_session_reaction:
      enabled: true
      levels:
        - ["prior_high", "prior_low", "overnight_high", "overnight_low"]
      touch_ticks: [8.0]
      min_close_ticks: [1.0]
      invert_direction: [false, true]
      direction: [0]

    liquidity_sweep_failure:
      enabled: true
      lookback: [10, 20]
      sweep_ticks: [1.0, 2.0]
      close_back_ticks: [1.0]
      invert_direction: [false, true]
      direction: [0]

  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [12, 20]
      stop: [8, 12]
    max_bars_timeout: 15
    timeout_result: at_close
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 600
    top_n: 10
  hardening: {enabled: false}

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    options:
      top_n: 30
