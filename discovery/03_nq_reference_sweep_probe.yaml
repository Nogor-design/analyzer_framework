report:
  title: "NQ Reference Level Sweep Probe"
  output_filename: "03_nq_reference_sweep_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

level_discovery:
  enabled: true
  min_trades: 40
  atr_period: 14
  timeframes: [1, 5]
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}

    prior_session_reaction:
      enabled: true
      levels:
        - ["prior_high", "prior_low"]
        - ["overnight_high", "overnight_low"]
        - ["prior_close"]
      touch_ticks: [4.0, 8.0, 12.0]
      min_close_ticks: [1.0, 2.0, 4.0]
      direction: [0]
      invert_direction: [false, true]

    liquidity_sweep_failure:
      enabled: true
      lookback: [10, 20, 40]
      sweep_ticks: [1.0, 2.0, 4.0]
      close_back_ticks: [1.0, 2.0]
      direction: [0]
      invert_direction: [false, true]

  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [12, 16, 20, 24]
      stop: [8, 10, 12, 16]
    max_bars_timeout: 20
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 700
    top_n: 10
  hardening:
    enabled: true
    n_mc_simulations: 150
    n_hypotheses_tested: 288
    min_t_stat_abs: 1.5
    wf_config:
      wf_type: rolling
      n_folds: 3
      min_is_trades: 20
      min_oos_trades: 10
      degradation_threshold: 0.40
    slippage_stress:
      enabled: true
      slippage_ticks: [1, 2, 3]
      entry_delays: [0, 1, 2]
      delay_cost_per_bar_ticks: 1.0
      max_expectancy_loss_pct: 60.0
      stress_cell: [2, 1]
    require_slippage_stress_passed: false

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30
