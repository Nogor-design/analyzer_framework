# Discovery-config skeleton for the orb_failure_reclaim family.
#
# Consumed by ta_foundation.agent.tools.probe_config.build_probe_config, which
# author_probe calls to emit a runnable, single-combination probe YAML for a
# pre-registered hypothesis (Phase 0 defect #9).
#
# The six family-whitelist params (orb_minutes, sweep_min_ticks,
# reclaim_within_bars, fill_mode, stop_ticks, target_ticks) plus the session
# window and direction are substituted in by the builder. Every other key here
# is a fixed engine / economics constant carried verbatim from the proven
# NY-open ORB locked-hardening config. The values left below are defaults that
# the builder overwrites; the file is itself a valid runnable config.
discovery:
  stage: "06_validate"
  instrument: "NQ"

orb_discovery:
  enabled: true
  min_trades: 40
  orb:
    signal_type: ["failure_reclaim"]
    orb_minutes: [5]              # <- substituted: params.orb_minutes
    session_open_hour: 7          # <- substituted: from session_window
    session_open_minute: 30       # <- substituted: from session_window
    session_close_hour: 10        # <- substituted: from session_window
    direction: [0]                # <- substituted: from hypothesis.direction
    min_range_ticks: [8]
    require_close_beyond: [true]
    one_signal_per_side: true
    min_sweep_ticks: [4.0]        # <- substituted: params.sweep_min_ticks
    close_back_ticks: [0.0]
    max_reclaim_bars: [1]         # <- substituted: params.reclaim_within_bars
    tick_size: 0.25
    atr_period: 14
  entry_timing:                   # <- substituted wholesale: from params.fill_mode
    next_open: {enabled: false}
    break_extreme: {enabled: false, buffer_ticks: 1, fill_timeout_bars: 3}
    body_midpoint: {enabled: true, fill_timeout_bars: 5}
  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [150]          # <- substituted: params.target_ticks
      stop: [20]                  # <- substituted: params.stop_ticks
    max_bars_timeout: 90
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1
  filter_discovery: {enabled: false}
  hardening:
    enabled: true
    n_mc_simulations: 500
    # Selection-bias denominator carried from the proven config. A dynamic
    # value sourced from count_hypotheses_tested() is a Phase 1 refinement.
    n_hypotheses_tested: 2592
    min_t_stat_abs: 1.5
    wf_config:
      wf_type: rolling
      n_folds: 3
      min_is_trades: 20
      min_oos_trades: 10
      degradation_threshold: 0.40
    holdout:
      enabled: true
      is_frac: 0.60
      val_frac: 0.20
      time_col: entry_time
      min_dev_trades: 80
      min_holdout_trades: 20
      require_holdout_passed: true
      min_profit_factor: 1.0
    slippage_stress:
      enabled: true
      slippage_ticks: [1, 2, 3]
      entry_delays: [0, 1, 2]
      delay_cost_per_bar_ticks: 1.0
      max_expectancy_loss_pct: 60.0
      stress_cell: [2, 1]
    require_slippage_stress_passed: true

sections:
  - id: orb_discovery_overview
  - id: strategy_discovery_unified
    top_n: 10
