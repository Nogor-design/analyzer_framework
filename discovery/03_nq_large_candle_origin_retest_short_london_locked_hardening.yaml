report:
  title: "NQ Large Candle Origin Retest — Short London Locked Hardening"
  output_filename: "03_nq_large_candle_origin_retest_short_london_locked_hardening.html"
  timezone: "America/Denver"

discovery:
  stage: "06_validate"
  instrument: "NQ"

# Locked from a session-conditioned pocket discovered inside the
# short-only hardening probe (which itself failed t-test and slippage
# stress overall, but the per-session holdout breakdown showed clean
# differentiation — London PF 2.74, NyMid PF 2.45, PowerHr PF 1.96 vs
# Asia/NyOpen/NyPre all sub-1.0).
#
# Single-block session_filter cannot combine London + NyMid + PowerHr,
# so this probe isolates the largest and strongest pocket — London —
# and asks the structural question: does session-restricting the same
# short-only direction-split candidate change the slippage curve?
# (The all-session run lost 95% of expectancy at the required 2t / 1-bar
# stress cell. Fatter London winners may absorb more execution cost,
# or the family may simply be dead.)
#
# Locked configuration:
#   - rank-1 grid params: avg_lookback=40, large_body_mult=2.5,
#     min_body_ticks=8, max_retest_bars=6, touch_ticks=8, min_close_ticks=2
#   - direction=-1 (short only)
#   - max_dist_ticks=12 (conditional filter from rule mining)
#   - session_filter: London (00:00-05:59 Denver)
#   - 40 tick TP / 8 tick SL

level_discovery:
  enabled: true
  min_trades: 20
  atr_period: 14
  timeframes: [5]
  session_filter:
    hour_from: 0
    minute_from: 0
    hour_to: 6
    minute_to: 0
  signals:
    swing_level_test:        {enabled: false}
    consolidation_breakout:  {enabled: false}
    round_number_bounce:     {enabled: false}
    vwap_reclaim_reject:     {enabled: false}
    vwap_continuation:       {enabled: false}
    prior_session_reaction:  {enabled: false}
    reference_sweep_reclaim: {enabled: false}
    failed_reference_breakout: {enabled: false}
    liquidity_sweep_failure: {enabled: false}

    large_candle_origin_retest:
      enabled: true
      avg_lookback: [40]
      large_body_mult: [2.5]
      min_body_ticks: [8.0]
      max_retest_bars: [6]
      touch_ticks: [8.0]
      min_close_ticks: [2.0]
      max_dist_ticks: [12]
      min_atr_ticks: [4.0]
      direction: [-1]
      invert_direction: [false]

  entry_timing:
    next_open:     {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [40]
      stop: [8]
    max_bars_timeout: 40
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery: {enabled: false}

  hardening:
    enabled: true
    n_mc_simulations: 500
    n_hypotheses_tested: 8640
    min_t_stat_abs: 1.5
    wf_config:
      wf_type: rolling
      n_folds: 3
      min_is_trades: 15
      min_oos_trades: 8
      degradation_threshold: 0.40
    holdout:
      enabled: true
      is_frac: 0.60
      val_frac: 0.20
      time_col: entry_time
      min_dev_trades: 40
      min_holdout_trades: 10
      require_holdout_passed: true
      min_profit_factor: 1.0
    slippage_stress:
      enabled: true
      slippage_ticks: [1, 2, 3]
      entry_delays: [0, 1, 2]
      delay_cost_per_bar_ticks: 1.0
      max_expectancy_loss_pct: 60.0
      stress_cell: [2, 1]
    require_slippage_stress_passed: true

research_note:
  status: "locked_research_candidate_hardening"
  parent_config: "discovery/03_nq_large_candle_origin_retest_short_locked_hardening.yaml"
  parent_sidecar: "output/03_nq_large_candle_origin_retest_short_locked_hardening_summary.json"
  rationale: "All-session short-only candidate failed adjusted t-test (3.32 vs 4.61) and lost 95% of expectancy at the 2t/1-bar stress cell. Per-session holdout breakdown isolated London PF 2.74 / NyMid 2.45 / PowerHr 1.96 vs Asia/NyOpen/NyPre PF<1. This probe tests whether the London-only subset escapes the structural slippage fragility that killed the all-session run."
  caution: "If this probe also fails slippage stress, the entire large_candle_origin_retest family is execution-fragile and the only honest action is graveyard. If it passes, candidate is research-grade and needs forward-shadow observation."

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 10
