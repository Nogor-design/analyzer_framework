report:
  title: "NQ Failed Reference Breakout Probe"
  output_filename: "03_nq_failed_reference_breakout_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

# Hypothesis: a *confirmed* close beyond prior RTH or overnight high/low
# that fails back through the level traps breakout participants and tends
# to reverse harder than a simple wick-sweep. Distinct from
# `reference_sweep_reclaim`, which captures the single-bar sweep pattern;
# this detector requires the breakout to have first been confirmed.

level_discovery:
  enabled: true
  min_trades: 40
  atr_period: 14
  timeframes: [1, 5]
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}
    vwap_continuation: {enabled: false}
    prior_session_reaction: {enabled: false}
    reference_sweep_reclaim: {enabled: false}
    liquidity_sweep_failure: {enabled: false}
    large_candle_origin_retest: {enabled: false}

    failed_reference_breakout:
      enabled: true
      levels:
        - ["prior_high", "prior_low"]
        - ["overnight_high", "overnight_low"]
        - ["prior_high", "prior_low", "overnight_high", "overnight_low"]
      confirmation_ticks: [1.0, 2.0, 4.0]
      max_fail_bars: [4, 8, 12]
      fail_close_ticks: [1.0, 2.0]
      min_atr_ticks: [4.0]
      direction: [0]
      invert_direction: [false]

  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [16, 24, 40, 60, 100]
      stop: [8, 12, 16, 20]
    max_bars_timeout: 40
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 700
    top_n: 10

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30

research_note:
  status: "broad_probe"
  thesis: "Confirmed-close-then-fail breakouts of prior/overnight reference levels — trapped-breakout reversal hypothesis."
  caution: "Broad probe — expect many filter rows below PF 1.0. Mine entry_discovery.top_rules for tradable pockets before promoting."
