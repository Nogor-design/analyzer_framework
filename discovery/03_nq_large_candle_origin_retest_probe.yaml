report:
  title: "NQ Large Candle Origin Retest Probe"
  output_filename: "03_nq_large_candle_origin_retest_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

# Hypothesis: after an unusually large directional candle, a retest of that
# candle's origin (its open) tends to act as support/resistance for
# continuation. This is the entry-signal counterpart to the existing
# large_candle_excursion analysis (which is event-statistics only).

level_discovery:
  enabled: true
  min_trades: 40
  atr_period: 14
  timeframes: [1, 5]
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}
    vwap_continuation: {enabled: false}
    prior_session_reaction: {enabled: false}
    reference_sweep_reclaim: {enabled: false}
    failed_reference_breakout: {enabled: false}
    liquidity_sweep_failure: {enabled: false}

    large_candle_origin_retest:
      enabled: true
      avg_lookback: [20, 40]
      large_body_mult: [1.6, 2.0, 2.5]
      min_body_ticks: [8.0, 12.0]
      max_retest_bars: [6, 12, 20]
      touch_ticks: [3.0, 5.0, 8.0]
      min_close_ticks: [2.0, 3.0]
      min_atr_ticks: [4.0]
      direction: [0]
      invert_direction: [false]

  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [16, 24, 40, 60, 100]
      stop: [8, 12, 16, 20]
    max_bars_timeout: 40
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1

  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 700
    top_n: 10

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30

research_note:
  status: "broad_probe"
  thesis: "Large-candle origin retest — continuation entry when price returns to the open price of a recent outsized candle."
  caution: "Broad probe — expect many filter rows below PF 1.0. Mine entry_discovery.top_rules for tradable pockets before promoting."
