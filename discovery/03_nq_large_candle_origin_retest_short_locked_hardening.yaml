  rationale: "Only non-numeric conditional dimension surfaced in the broad probe's 25 ranked rows. Sister high-ATR pocket (signal_atr x level_dist_ticks) already failed slippage stress; this short-only / tight-distance pocket explores a structurally different filter and is the family's last research opportunity before graveyard."
  caution: "Conditional pocket buried below the auto-promoter's top-10 cutoff. Requires hardening, stress, locked holdout, and forward-shadow observation before any deployment claim."

