report:
  title: "NQ NY Open ORB Short Hardened Probe"
  output_filename: "04_nq_ny_open_orb_short_hardened.html"
  timezone: "America/Denver"

discovery:
  stage: "05_orb_momentum"
  instrument: "NQ"

orb_discovery:
  enabled: true
  min_trades: 20
  orb:
    orb_minutes: [15]
    session_open_hour: 7
    session_open_minute: 30
    session_close_hour: 10
    direction: [-1]
    min_range_ticks: [8, 16]
    require_close_beyond: [false]
    one_signal_per_side: true
    tick_size: 0.25
    atr_period: 14
  entry_timing:
    next_open: {enabled: false}
    break_extreme: {enabled: true, buffer_ticks: 1, fill_timeout_bars: 3}
  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [20, 24, 28]
      stop: [8, 10, 12]
    max_bars_timeout: 20
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1
  filter_discovery: {enabled: false}
  hardening:
    enabled: true
    n_mc_simulations: 250
    n_hypotheses_tested: 18
    min_t_stat_abs: 1.5
    wf_config:
      wf_type: rolling
      n_folds: 3
      min_is_trades: 10
      min_oos_trades: 5
      degradation_threshold: 0.40
    slippage_stress:
      enabled: true
      slippage_ticks: [1, 2, 3]
      entry_delays: [0, 1, 2]
      delay_cost_per_bar_ticks: 1.0
      max_expectancy_loss_pct: 60.0
      stress_cell: [2, 1]
    require_slippage_stress_passed: true

