report:
  title: "Large Candle Excursion Discovery"
  output_filename: "large_candle_excursion_discovery.html"
  timezone: "America/Denver"

large_candle_excursion:
  enabled: true
  timeframes: [1, 5]
  min_events: 20
  candle_size:
    average_lookbacks: [10, 20]
    threshold_mode: multiplier
    threshold_multipliers: [1.5, 2.0, 2.5]
  forward_window:
    minutes: [5, 10, 15, 30]
  trade_analysis:
    enabled: true
    target:
      percents: [25, 50, 75, 100, 125]
  volume_context:
    enabled: true
  candle_structure_context:
    enabled: true
  volatility_context:
    enabled: true

  # ---- User-defined time segment analysis ----
  # Segments may overlap — each window is evaluated independently.
  # Boundaries are in America/New_York time.
  time_segment_analysis:
    enabled: true
    timezone: "America/New_York"
    min_events: 15
    segments:
      - label: early_london
        start: "00:00"
        end:   "04:00"
      - label: mid_london
        start: "04:00"
        end:   "07:00"
      - label: london_ny_overlap
        start: "06:00"
        end:   "09:00"
      - label: ny_pre_open
        start: "07:00"
        end:   "09:30"
      - label: ny_open
        start: "09:30"
        end:   "11:00"
      - label: mid_day
        start: "11:00"
        end:   "14:00"
      - label: power_hour
        start: "14:00"
        end:   "16:00"
      - label: after_hours
        start: "16:00"
        end:   "18:00"

large_candle_excursion_discovery:
  enabled: true
  source_report: large_candle_excursion
  objective:
    primary_metric: composite_score
    min_events: 30
    min_win_rate: 0.50
  stages:
    broad_scan:
      enabled: true
      top_n_to_keep: 50
    refinement:
      enabled: true
      top_n_parents: 20
      refinement_rules:
        target_percent_step: 10
        threshold_multiplier_step: 0.25
    interaction_chaining:
      enabled: true
      top_n_parents: 10
      max_chain_depth: 3
      min_incremental_improvement: 0.03
      min_remaining_events: 50
      min_score: 0.45
      attempted_top_n: 15
    robustness_validation:
      enabled: true
      time_splits: 3
      require_neighbor_stability: true
      require_out_of_sample_check: false
  neighbor_analysis:
    enabled: true
    top_setups: 10
    max_neighbors: 8
    target_neighbor_values: [15, 25, 35, 50]
  friction:
    commission_per_trade: 4.18
    tick_value: 5.00
    slippage_ticks_per_side: 1
    additional_buffer_ticks: 0
    min_target_ticks: 6
    min_net_target_ticks: 2
    min_post_friction_rr: 0.25
    filter_mode: penalize
    risky_net_expectancy_ticks: 0
    risky_cost_to_target_ratio: 0.35
    risky_post_friction_rr: 0.35
  output:
    include_diagnostics: true
    top_n_final_discoveries: 25

sections:
  - id: large_candle_excursion_discovery_summary
  - id: large_candle_excursion_discovery_broad_scan
  - id: large_candle_excursion_discovery_refinement
  - id: large_candle_excursion_discovery_chains
  - id: large_candle_excursion_discovery_robustness
  - id: large_candle_excursion_time_segments
  - id: large_candle_excursion_discovery_diagnostics
  - id: large_candle_excursion_discovery_next_steps
  - id: large_candle_excursion_discovery_methodology
