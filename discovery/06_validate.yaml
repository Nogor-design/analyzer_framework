# ============================================================
# STAGE 6 — VALIDATE TOP COMBOS
# ============================================================
# Run this LAST. Take the top 2-3 combos from stages 2-5 and
# verify them with strict IS/OOS walk-forward validation.
#
# HOW TO USE:
#   1. From stages 2-5, note the exact winning parameters:
#      - Signal family (candle/LCR/ORB/MA/etc.)
#      - Signal type (pattern name, multiplier, etc.)
#      - Timeframe (1m or 5m)
#      - TP ticks / SL ticks
#   2. Edit ONLY those values into this file.
#   3. Set min_trades to a higher value (30+) for stricter validation.
#   4. Run and check the "Walk-Forward Validation" section.
#
# Runtime: ~2-3 minutes with --no-tick-data
# Combos:  ~50-100 (just your top combos)
#
# WHAT TO LOOK AT:
#   "Strategy Discovery — Walk-Forward Validation" section.
#   IS/OOS degradation < 0.15 = robust.
#   IS/OOS degradation > 0.40 = overfit, don't trade it.
#
#   "Strategy Discovery — Cohort Analysis" section.
#   Does PF stay consistent month-to-month? Decaying = regime-dependent.
# ============================================================

report:
  title: "Stage 6 — Validation"
  output_filename: "06_validate.html"
  timezone: "America/Denver"

# ============================================================
# EDIT THESE TO MATCH YOUR TOP COMBOS FROM STAGES 2-5
# Currently set to the most common winning patterns as defaults.
# ============================================================

candle_discovery:
  enabled: true
  session_filter:
    hour_from: 7
    minute_from: 30
    hour_to: 16
  timeframes: [1]     # ← Lock to the winning TF from stage 2
  min_trades: 30      # Higher threshold = only strong combos survive

  candle_features:
    size_lookbacks: [10]
    atr_period: 14
    tick_size: 0.25
    min_body_ticks: 2

  patterns:
    # ← EDIT: Enable only the patterns that won in stage 2.
    # Disable everything that didn't.
    large_body:
      enabled: true
      body_multiplier: [2.0]  # ← Use the exact winning value
      wick_to_body_max: [0.5]
      lookback: [10]
      min_size_ticks: 3

    inside_bar:
      enabled: true         # ← Enable/disable based on stage 2 results

    # Everything else disabled for clean validation
    clean_breakout_bar: {enabled: false}
    pin_bar_bullish:    {enabled: false}
    pin_bar_bearish:    {enabled: false}
    engulfing_bullish:  {enabled: false}
    engulfing_bearish:  {enabled: false}
    outside_bar:        {enabled: false}
    doji:               {enabled: false}

  direction: both

  entry_timing:
    next_open:
      enabled: true         # ← Use the entry type that won in stage 2
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}

  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [20]     # ← Use the exact winning TP from stage 2
      stop: [10]            # ← Use the exact winning SL from stage 2
    max_bars_timeout: 15
    timeout_result: loss

  slippage_ticks: 1
  filter_discovery: {enabled: false}

# ============================================================
# LCR — validate top LCR combo from stage 3
# Edit multiplier/signal_type to match your stage 3 winner
# ============================================================
lcr_discovery:
  enabled: true
  session_filter:
    hour_from: 7
    minute_from: 30
    hour_to: 16
  size_multipliers: [2.5]   # ← Use the winning multiplier from stage 3
  lookbacks: [20]
  zone_types: ["body"]
  tp_ticks: [20]
  sl_ticks: [10]
  tick_size: 0.25
  tick_value: 12.50
  max_bars_timeout: 20
  retrace_window: 20
  signal_types: ["retrace"]  # ← Usually the best; edit if stage 3 showed otherwise
  min_trades: 30
  max_active_regions: 100
  max_region_age: 500

sections:
  # The key validation sections:
  - id: strategy_discovery_validation
    # IS/OOS walk-forward validation table

  - id: strategy_discovery_cohort
    # Month-by-month PF consistency — does it decay?

  - id: strategy_discovery_ranked_table
    options:
      top_n: 20

  - id: candle_discovery_ranking
    options:
      top_n: 10

  - id: lcr_discovery_overview
    options:
      top_n: 5

  - id: strategy_discovery_drawdown
    # Max drawdown profile — does it have a catastrophic drawdown?
