report:
  title: "NQ NY Open Reference Sweep Reclaim Probe"
  output_filename: "04_nq_ny_open_reference_sweep_reclaim_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "04_ny_open"
  instrument: "NQ"

level_discovery:
  enabled: true
  timeframes: [1, 5]
  min_trades: 20
  atr_period: 14
  session_filter: {hour_from: 7, minute_from: 30, hour_to: 10}
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}
    prior_session_reaction: {enabled: false}
    liquidity_sweep_failure: {enabled: false}
    reference_sweep_reclaim:
      enabled: true
      levels:
        - ["prior_high", "prior_low"]
        - ["overnight_high", "overnight_low"]
      sweep_ticks: [1.0, 2.0, 4.0, 8.0]
      close_back_ticks: [0.0, 1.0, 2.0]
      direction: [0, 1, -1]
      min_atr_ticks: [4.0, 8.0]
      rth_start_hour: 7
      rth_start_minute: 30
      rth_end_hour: 16
      rth_end_minute: 0
  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false, buffer_ticks: 1, fill_timeout_bars: 3}
    body_midpoint: {enabled: true, fill_timeout_bars: 5}
  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [50, 80, 100, 150]
      stop: [20, 30, 50]
    max_bars_timeout: 90
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1
  filter_discovery: {enabled: true, top_n: 10}
  entry_discovery: {enabled: true, top_n: 10, min_bucket_trades: 20}
  hardening: {enabled: false}

research_note:
  status: "broad_structural_probe"
  thesis: "Fade failed NY-open sweeps of prior RTH and overnight extremes only after a close back through the reference level."
  caution: "Search probe only. Any high-PF row needs a separate locked hardening/holdout run."

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 20
