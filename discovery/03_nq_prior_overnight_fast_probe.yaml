report:
  title: "NQ Prior Overnight Level Fast Probe"
  output_filename: "03_nq_prior_overnight_fast_probe.html"
  timezone: "America/Denver"

discovery:
  stage: "03_levels_regions"
  instrument: "NQ"

level_discovery:
  enabled: true
  min_trades: 40
  atr_period: 14
  timeframes: [1]
  signals:
    swing_level_test: {enabled: false}
    consolidation_breakout: {enabled: false}
    round_number_bounce: {enabled: false}
    vwap_reclaim_reject: {enabled: false}
    liquidity_sweep_failure: {enabled: false}
    prior_session_reaction:
      enabled: true
      levels:
        - ["prior_high", "prior_low"]
        - ["overnight_high", "overnight_low"]
        - ["prior_close"]
      touch_ticks: [4.0, 8.0]
      min_close_ticks: [1.0, 2.0]
      direction: [0]
      invert_direction: [false, true]
  entry_timing:
    next_open: {enabled: true}
    break_extreme: {enabled: false}
    body_midpoint: {enabled: false}
  outcome:
    atr: {enabled: false}
    ticks:
      enabled: true
      take_profit: [12, 20]
      stop: [8, 12]
    max_bars_timeout: 20
    timeout_result: "at_close"
    tick_size: 0.25
    tick_value: 5.0
    commission_per_side: 2.09
    slippage_ticks: 1
  filter_discovery: {enabled: false}
  entry_discovery:
    enabled: true
    max_depth: 2
    min_trades: 40
    max_candidates: 500
    top_n: 10
  hardening: {enabled: false}

sections:
  - id: level_discovery_overview
  - id: strategy_discovery_unified
    top_n: 30
