  - id: filter_discovery
    title: "Filter + Entry Signal Discovery"
    options:
      bar_tf: "5m"
      htf_tf: "15m"
      atr_period: 14
      ema_period: 50
      min_trades: 10
      entry_signal_per_run: true
      entry_signal_per_run_min_trades: 1
      entry_signal_per_run_top_n: 20
      entry_signal_show_run_coverage: true

      entry_signal_enable: true

      # Futures session definition (Denver)
      session_start: "07:30"
      globex_start: "16:00"
      opening_range_minutes: 15

      # Per-run entry signal tables
#      entry_signal_per_run: true
#      entry_signal_per_run_top_n: 12
#      entry_signal_per_run_min_trades: 30

      # Optional: keep pooled view
      entry_signal_show_pooled: false
      entry_signal_insight_min_trades: 8
      entry_signal_insight_top_n: 10
