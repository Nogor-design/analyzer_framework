report:
  title: "Strategy Comparison Report"
  output_filename: "Filter_Discovery_report.html"
  embedded_images: true   # enforced by builder; kept for clarity
  timezone: "America/Denver"

sections:


  - id: filter_discovery
    title: "Filter + Entry Signal Discovery"
    options:
      bar_tf: "5m"
      htf_tf: "15m"
      atr_period: 14
      ema_period: 50
      top_n_runs: 60
      min_trades: 10

      # NEW
      entry_signal_enable: true
      tick_size: 0.25          # NQ
      entry_prev_bars: 1
      entry_swing_k: 2
      entry_near_edges_atr: [ 0.5, 1.0, 2.0 ]
      entry_near_labels: [ "<=0.5 ATR", "0.5–1 ATR", "1–2 ATR", ">2 ATR" ]


