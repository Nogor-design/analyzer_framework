[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ta_foundation"
version = "0.1.0"
description = "Reusable trading analysis foundation"
requires-python = ">=3.10"

dependencies = [
  "pandas",
  "matplotlib",
  "pyyaml",
]

[project.optional-dependencies]
analysis = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pyarrow",
]
prediction = [
  "anthropic>=0.90.0",
]
reporting = [
  "playwright",
]
persistence = [
  "duckdb",
]
web = [
  "flask",
]
agentic = [
  "langchain",
  "langgraph",
  "langchain-ollama",
  "langgraph-checkpoint-sqlite",
]
dev = [
  "pytest",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::RuntimeWarning:scipy.*",
    "ignore::RuntimeWarning:numpy.*",
]
